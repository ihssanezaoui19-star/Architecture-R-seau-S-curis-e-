<?xml version="1.0" encoding="UTF-8"?>
<svg class="architecture-svg" width="1200" height="635" viewBox="0 0 1200 635" role="img" aria-label="Zero Trust · zones et visibilité" xmlns="http://www.w3.org/2000/svg">
<style>
svg{background:#fff;font-family:Arial,Helvetica,sans-serif}
.arch-zone rect{fill:#f4f8fa;stroke:#b9ccd7;stroke-width:1.5;stroke-dasharray:6 5}
.arch-zone-hostile rect{fill:#fff3f0;stroke:#f0b9af}
.arch-zone-observe rect{fill:#edf8f8;stroke:#a9d9da}
.arch-zone-planned rect{fill:#fbf7ee;stroke:#d6c9aa}
.arch-zone text{font:500 15px 'DejaVu Sans Mono',monospace;fill:#305777}
.arch-edge{fill:none;stroke:#829cad;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.arch-edge-hostile{stroke:#e44c3d}
.arch-edge-telemetry{stroke:#0998a0;stroke-dasharray:6 5}
.arch-edge-planned{stroke:#b48a54;stroke-dasharray:6 5}
.arch-marker-flow path{fill:#829cad}
.arch-marker-hostile path{fill:#e44c3d}
.arch-marker-telemetry path{fill:#0998a0}
.arch-marker-planned path{fill:#b48a54}
.arch-card-face{fill:#fff;stroke:#bed0dc;stroke-width:1.6}
.arch-card-dark .arch-card-face{fill:#0e2738;stroke:#0e2738}
.arch-card-observe .arch-card-face{stroke:#04959e;stroke-width:1.9}
.arch-card-risk .arch-card-face{stroke:#e2b2aa}
.arch-card-planned .arch-card-face{stroke:#bc9b66;stroke-dasharray:6 5}
.arch-icon-disc{fill:#e2ecf2}
.arch-card-risk .arch-icon-disc{fill:#ffe2dc}
.arch-card-observe .arch-icon-disc{fill:#d9f1f0}
.arch-card-dark .arch-icon-disc{fill:#355062}
.arch-card-planned .arch-icon-disc{fill:#f4ead3}
.arch-icon{font:700 13px Arial,sans-serif;fill:#12394e}
.arch-card-risk .arch-icon{fill:#e44c3d}
.arch-card-observe .arch-icon{fill:#047f88}
.arch-card-dark .arch-icon{fill:#fff}
.arch-title{font:700 17px Arial,sans-serif;fill:#071d30}
.arch-card-dark .arch-title{fill:#fff}
.arch-sub{font:12px 'DejaVu Sans Mono',monospace;fill:#3d6383}
.arch-card-dark .arch-sub{fill:#91cafa}
.arch-step-disc{fill:#0b283c}
.arch-step{fill:#fff;font:700 11px 'DejaVu Sans Mono',monospace}
.arch-edge-label{fill:#087e88;font:12px 'DejaVu Sans Mono',monospace}
</style>

          <defs><marker id="arch-arrow-03-flow" class="arch-marker-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker><marker id="arch-arrow-03-hostile" class="arch-marker-hostile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker><marker id="arch-arrow-03-telemetry" class="arch-marker-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker><marker id="arch-arrow-03-planned" class="arch-marker-planned" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker></defs>
          <g class="arch-zone arch-zone-neutral"><rect x="18" y="64" width="265" height="544" rx="16"/><text x="38" y="95">Accès</text></g><g class="arch-zone arch-zone-neutral"><rect x="306" y="64" width="550" height="544" rx="16"/><text x="326" y="95">Contrôle et segmentation</text></g><g class="arch-zone arch-zone-observe"><rect x="880" y="64" width="302" height="544" rx="16"/><text x="900" y="95">Observation</text></g>
          <g class="arch-edges"><path class="arch-edge arch-edge-flow" d="M263 210 H292 V310 H332" marker-end="url(#arch-arrow-03-flow)"/><path class="arch-edge arch-edge-flow" d="M263 410 H292 V310 H332" marker-end="url(#arch-arrow-03-flow)"/><path class="arch-edge arch-edge-flow" d="M570 310 H588 V190 H606" marker-end="url(#arch-arrow-03-flow)"/><path class="arch-edge arch-edge-flow" d="M570 310 H588 V410 H606" marker-end="url(#arch-arrow-03-flow)"/><path class="arch-edge arch-edge-telemetry" d="M828 190 H902" marker-end="url(#arch-arrow-03-telemetry)"/><path class="arch-edge arch-edge-telemetry" d="M828 410 H902" marker-end="url(#arch-arrow-03-telemetry)"/><path class="arch-edge arch-edge-telemetry" d="M1028 235 V365" marker-end="url(#arch-arrow-03-telemetry)"/></g>
          <g class="arch-card arch-card-plain" aria-label="Accès distant : Les droits VPN et la vérification MFA limitent les accès distants." transform="translate(38 165)">
      <rect class="arch-card-face" width="225" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">VPN</text>
      <text class="arch-title"><tspan x="60" y="40">Accès distant</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">OpenVPN avec MFA</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">01</text>
    </g><g class="arch-card arch-card-plain" aria-label="Utilisateurs : Les profils utilisateurs, administration et invités sont séparés." transform="translate(38 365)">
      <rect class="arch-card-face" width="225" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">LAN</text>
      <text class="arch-title"><tspan x="60" y="40">Utilisateurs</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Réseaux locaux</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">02</text>
    </g><g class="arch-card arch-card-dark" aria-label="OPNsense : Le pare-feu applique les règles entre zones ; les exceptions ont été vérifiées." transform="translate(332 265)">
      <rect class="arch-card-face" width="238" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">FW</text>
      <text class="arch-title"><tspan x="60" y="40">OPNsense</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Règles inter-zones</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">03</text>
    </g><g class="arch-card arch-card-plain" aria-label="LAN / administration : La séparation réduit les accès transversaux dans la maquette." transform="translate(606 145)">
      <rect class="arch-card-face" width="222" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">LAN</text>
      <text class="arch-title"><tspan x="60" y="40">LAN /</tspan><tspan x="60" y="57">administration</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Segments distincts</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">04</text>
    </g><g class="arch-card arch-card-plain" aria-label="DMZ / invités : Les services exposés et les invités ont des droits distincts." transform="translate(606 365)">
      <rect class="arch-card-face" width="222" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">DMZ</text>
      <text class="arch-title"><tspan x="60" y="40">DMZ / invités</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Accès ciblés</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">05</text>
    </g><g class="arch-card arch-card-observe" aria-label="Suricata : Suricata détecte ici ; aucun blocage automatique n’est démontré." transform="translate(902 145)">
      <rect class="arch-card-face" width="252" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">IDS</text>
      <text class="arch-title"><tspan x="60" y="40">Suricata</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Détection sur copie</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">06</text>
    </g><g class="arch-card arch-card-observe" aria-label="Wazuh + journaux : Wazuh rassemble les journaux pour comprendre les événements." transform="translate(902 365)">
      <rect class="arch-card-face" width="252" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">LOG</text>
      <text class="arch-title"><tspan x="60" y="40">Wazuh + journaux</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Corrélation des traces</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">07</text>
    </g>
        </svg>
